[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "interviewgraph"
version = "0.0.1"
description = "An open interview-question dataset and knowledge graph, with a JD-aware question ranker on top."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PyYAML>=6.0",
    "jsonschema>=4.18",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
interviewgraph = "interviewgraph.__main__:main"

[tool.setuptools.packages.find]
include = ["interviewgraph*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
